[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NeuralFoil"
version = "0.3.3"
description = "NeuralFoil is an airfoil aerodynamics analysis tool using physics-informed machine learning, in pure Python/NumPy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Peter Sharpe", email = "pds@mit.edu" }
]
keywords = [
    "python",
    "machine learning",
    "analysis",
    "optimization",
    "aerospace",
    "airplane",
    "cfd",
    "aircraft",
    "hydrodynamics",
    "aerodynamics",
    "sailing",
    "propeller",
    "airfoil",
    "xfoil",
    "design",
    "mdo",
    "mdao",
    "physics informed neural network",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.26",
    # 4.2.7 is the first AeroSandbox release compatible with NeuralFoil 0.3.x
    # (earlier releases pin neuralfoil<0.3.0). Capped below the next minor
    # because the two packages co-evolve; see AeroSandbox's mirrored cap.
    "aerosandbox>=4.2.7,<4.3.0",
]

[project.optional-dependencies]
# Extras are for consumers of the published package. Training and docs
# dependencies live in [dependency-groups] instead, since the training code
# is not shipped in the wheel and is only usable from a repo checkout.
test = [
    "pytest>=7.0",
    "nbval>=0.10",
]

[project.urls]
Source = "https://github.com/peterdsharpe/NeuralFoil"
"Bug Reports" = "https://github.com/peterdsharpe/NeuralFoil/issues"

[dependency-groups]
training = [
    "torch>=2.0",
    "ray>=2.7",
    "tyro>=0.9",
    "polars>=1.0",
    "tqdm>=4.60",
]
dev = [
    { include-group = "training" },
    "pytest>=7.0",
    "nbval>=0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["neuralfoil"]

[tool.hatch.build.targets.sdist]
include = [
    "/neuralfoil",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE.txt",
]
